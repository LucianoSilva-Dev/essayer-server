services:
  essayer-server:
    build: .
    container_name: essayer-server-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-3001}:${SERVER_PORT:-3001}"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-3001}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: "redis:8.2-alpine"
    container_name: essayer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres-test:
    image: postgres:16-alpine
    container_name: essayer-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incita_test
    ports:
      - "5433:5432"

  redis-test:
    image: redis:8.2-alpine
    container_name: essayer-redis-test
    ports:
      - "6380:6379"

  mailpit-test:
    image: axllent/mailpit:latest
    container_name: essayer-mailpit-test
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  redis-data: